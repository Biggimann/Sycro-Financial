{% extends "base.html" %}
{% block title %}Bill Pay · SYCRO-FINANCIAL{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Pay a Bill</h1>
    <p class="subtle">Send a payment from your account</p>
  </div>
</div>

<div class="panel panel-narrow">
  <form method="POST">
    <label>Payee</label>
    <input type="text" name="payee" placeholder="Electric Company" required>
    <label>Pay From</label>
    <select name="account" required>
      <option value="checking">Checking</option>
      <option value="savings">Savings</option>
    </select>
    <label>Amount</label>
    <input type="text" name="amount" placeholder="0.00" required>
    <button type="submit" class="btn-primary">Send Payment</button>
  </form>
</div>
{% endblock %}
