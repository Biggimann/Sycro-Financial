{% extends "base.html" %}
{% block title %}Transfer · SYCRO-FINANCIAL{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Transfer Money</h1>
    <p class="subtle">Move funds between your own accounts</p>
  </div>
</div>

<div class="panel panel-narrow">
  <form method="POST">
    <label>From</label>
    <select name="from_account" required>
      <option value="checking">Checking</option>
      <option value="savings">Savings</option>
    </select>
    <label>To</label>
    <select name="to_account" required>
      <option value="savings">Savings</option>
      <option value="checking">Checking</option>
    </select>
    <label>Amount</label>
    <input type="text" name="amount" placeholder="0.00" required>
    <label>Note (optional)</label>
    <input type="text" name="note" placeholder="Transfer">
    <button type="submit" class="btn-primary">Send Transfer</button>
  </form>
</div>
{% endblock %}
