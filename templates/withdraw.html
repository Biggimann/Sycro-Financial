{% extends "base.html" %}
{% block title %}Withdraw · SYCRO-FINANCIAL{% endblock %}
{% block content %}
<div class="page-head">
  <div>
    <h1>Withdraw Funds</h1>
    <p class="subtle">Record a withdrawal from your selected account.</p>
  </div>
</div>

<div class="panel panel-narrow">
  <form method="POST">
    <label>Account</label>
    <select name="account" required>
      <option value="checking">Checking</option>
      <option value="savings">Savings</option>
    </select>
    <label>Amount</label>
    <input type="text" name="amount" placeholder="0.00" required>
    <label>Reference</label>
    <input type="text" name="note" placeholder="ATM, transfer, purchase">
    <button type="submit" class="btn-primary">Record Withdrawal</button>
  </form>
</div>
{% endblock %}
