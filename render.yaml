services:
  - type: web
    name: sycro-financial
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 90 --max-requests 500 --max-requests-jitter 50 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_DIR
        value: /tmp/sycro
      - key: ADMIN_EMAIL
        value: admin@northamerica-bank.com
      - key: ADMIN_KEY
        value: Ad$444
      - key: ADMIN_NAME
        value: North America Bank HQ
      - key: ADMIN_PHONE
        value: "(800) 555-0199"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
