services:
  - type: web
    name: sycro-financial
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --threads 4 --timeout 120 app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DB_DIR
        value: /opt/render/project/src/instance
    disk:
      name: sycro-data
      mountPath: /opt/render/project/src/instance
      sizeGB: 1
